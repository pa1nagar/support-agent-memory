# SAM Configuration File
# Credentials are NOT stored here - pass via environment or CLI

version = 0.1

[default]
[default.deploy]
[default.deploy.parameters]
stack_name = "support-agent-memory"
s3_prefix = "support-agent-memory"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
# Credentials passed at deploy time via:
#   sam deploy --parameter-overrides CockroachDBURL="..." BedrockModelID="..."
# Or set COCKROACHDB_URL in your shell before running sam deploy
parameter_overrides = "Environment=\"production\" BedrockModelID=\"us.anthropic.claude-sonnet-4-6\" BedrockEmbeddingModelID=\"amazon.titan-embed-text-v2:0\" MemoryRetrievalLimit=\"5\" MemorySimilarityThreshold=\"0.7\""
image_repositories = []

[default.build]
[default.build.parameters]
cached = true
parallel = true

[default.global.parameters]
region = "us-east-1"
