<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Agent Memory - CockroachDB × AWS Hackathon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            height: 90vh;
            display: grid;
            grid-template-columns: 1fr 300px;
            overflow: hidden;
        }

        .chat-section {
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e5e7eb;
        }

        .header {
            padding: 20px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            display: flex;
            justify-content: flex-end;
        }

        .message-assistant {
            display: flex;
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.5;
        }

        .message-user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-assistant .message-bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }

        .input-section {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .input-section input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .input-section button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .memory-panel {
            background: #f9fafb;
            padding: 20px;
            overflow-y: auto;
        }

        .memory-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #1f2937;
        }

        .memory-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #e5e7eb;
            animation: fadeIn 0.3s ease-in;
        }

        .memory-confidence {
            display: inline-block;
            padding: 4px 10px;
            background: #10b981;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .memory-content {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 5px;
        }

        .memory-time {
            font-size: 12px;
            color: #9ca3af;
        }

        .empty-memory {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            margin-top: 50px;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #667eea;
            font-size: 14px;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .memory-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Chat Section -->
        <div class="chat-section">
            <div class="header">
                <h1>🧠 Support Agent Memory</h1>
                <p>AI that remembers - powered by CockroachDB & AWS Bedrock</p>
            </div>
            
            <div class="messages" id="messages">
                <div class="message message-assistant">
                    <div class="message-bubble">
                        👋 Hi! I'm your support agent with memory. I remember our past conversations, so you never have to repeat yourself. How can I help you today?
                    </div>
                </div>
            </div>
            
            <div class="input-section">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message..." 
                    autocomplete="off"
                />
                <button id="sendButton" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- Memory Panel -->
        <div class="memory-panel">
            <h2>📝 Retrieved Memories</h2>
            <div id="memoryList">
                <div class="empty-memory">
                    Send a message to see retrieved memories
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://qmikeyw5qzk6bg3cw5tndq6vgq0yzuvl.lambda-url.us-east-1.on.aws';
        const USER_ID = 'c6a54245-1d39-55fd-8263-9f0c510ddc0a'; // Use seeded user ID

        // Deployed to AWS Lambda - Live Production URL

        let conversationId = null;

        // Send message on Enter key
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Disable input while processing
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;

            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';

            // Show loading indicator
            const loadingId = addMessage('', 'assistant', true);

            try {
                // Call API
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        message: message,
                        conversation_id: conversationId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                // Update conversation ID
                conversationId = data.conversation_id;

                // Remove loading indicator
                removeMessage(loadingId);

                // Add assistant response
                addMessage(data.response, 'assistant');

                // Update memory panel
                updateMemoryPanel(data.memories_used);

            } catch (error) {
                console.error('Error:', error);
                removeMessage(loadingId);
                addMessage('❌ Sorry, something went wrong. Please try again.', 'assistant');
            } finally {
                // Re-enable input
                input.disabled = false;
                document.getElementById('sendButton').disabled = false;
                input.focus();
            }
        }

        function addMessage(content, role, isLoading = false) {
            const messagesDiv = document.getElementById('messages');
            const messageId = 'msg-' + Date.now();
            
            const messageDiv = document.createElement('div');
            messageDiv.id = messageId;
            messageDiv.className = `message message-${role}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            
            if (isLoading) {
                bubbleDiv.innerHTML = `
                    <div class="loading">
                        <div class="loading-dots">
                            <div class="loading-dot"></div>
                            <div class="loading-dot"></div>
                            <div class="loading-dot"></div>
                        </div>
                        Thinking...
                    </div>
                `;
            } else {
                bubbleDiv.textContent = content;
            }
            
            messageDiv.appendChild(bubbleDiv);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            return messageId;
        }

        function removeMessage(messageId) {
            const messageDiv = document.getElementById(messageId);
            if (messageDiv) {
                messageDiv.remove();
            }
        }

        function updateMemoryPanel(memories) {
            const memoryList = document.getElementById('memoryList');
            
            if (!memories || memories.length === 0) {
                memoryList.innerHTML = '<div class="empty-memory">No memories retrieved for this message</div>';
                return;
            }

            memoryList.innerHTML = memories.map(memory => {
                const confidence = Math.round(memory.confidence * 100);
                const confidenceColor = confidence >= 90 ? '#10b981' : confidence >= 70 ? '#f59e0b' : '#ef4444';
                const date = new Date(memory.timestamp).toLocaleString();
                
                return `
                    <div class="memory-item">
                        <span class="memory-confidence" style="background: ${confidenceColor}">
                            ${confidence}% confident
                        </span>
                        <div class="memory-content">${memory.content}</div>
                        <div class="memory-time">📅 ${date}</div>
                    </div>
                `;
            }).join('');
        }

        // Focus input on load
        document.getElementById('messageInput').focus();
    </script>
</body>
</html>
